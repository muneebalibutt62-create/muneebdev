<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="contactstyle.css">
</head>

<body>
    <nav class="navbar">
        <ul class="links">
            <li><a href="index.html">Home</a></li>
            <li><a href="Contact.html">Contact Us</a></li>
            <li><a href="About-us.html">About Us</a></li>
        </ul>
    </nav>


    <main class="contact">
        <h1>Contact MuneebDev</h1>
        <p>Have a website project in mind? Let's talk!</p>

        <form class="contact-form" action="https://formspree.io/f/mzedowyr" method="POST">
            <label for="name">Your name</label>
            <input type="text" id="name" name="name" placeholder="Enter your name" required>

            <label for="email">Your email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required>

            <label for="message">Your message</label>
            <textarea id="message" name="message" rows="5" placeholder="Tell me about your website project..."
                required></textarea>

            <button type="submit">Send Message</button>
        </form>
    </main>

    <script>
        const contactForm = document.querySelector(".contact-form");

        contactForm.addEventListener("submit", async function (event) {
            event.preventDefault();

            const submitButton = contactForm.querySelector('button[type="submit"]');
            submitButton.disabled = true;
            submitButton.textContent = "Sending...";

            try {
                const response = await fetch(contactForm.action, {
                    method: "POST",
                    body: new FormData(contactForm),
                    headers: {
                        Accept: "application/json"
                    }
                });

                if (response.ok) {
                    window.location.href = "Thank you.html";
                } else {
                    alert("Sorry, your message could not be sent. Please try again.");
                    submitButton.disabled = false;
                    submitButton.textContent = "Send Message";
                }
            } catch (error) {
                alert("Connection error. Please check your internet and try again.");
                submitButton.disabled = false;
                submitButton.textContent = "Send Message";
            }
        });
    </script>

</body>

</html>
